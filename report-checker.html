<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>تصحيح تقارير العمليات | الهلال الأحمر</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css"/>
<link rel="stylesheet" href="leave2.css"/>
<link rel="stylesheet" href="reports-extra.css"/>
</head>
<body>

<!-- NAVBAR -->
<header class="navbar">
  <div class="navbar-brand">
    <div class="logo-icon"><img src="logo.png" alt="شعار الهلال" style="width: 100%; height: 100%; object-fit: contain; border-radius: 50%;" /></div>
    <span class="brand-title">شؤون الهلال الأحمر</span>
  </div>
  <div class="navbar-actions">
    <button id="theme-toggle" class="theme-btn">
      <span class="theme-icon dark-icon">🌙</span><span class="theme-icon light-icon">☀️</span>
      <span class="theme-label dark-label">الوضع الفاتح</span><span class="theme-label light-label">الوضع الداكن</span>
    </button>
  </div>
</header>

<!-- WRAPPER -->
<main class="lv-wrapper">

  <!-- FORM CARD -->
  <div class="lv-card">

    <div class="lv-card-header">
      <div class="lv-header-right">
        <a href="field-reports.html" class="lv-back">
          <svg viewBox="0 0 20 20" fill="none"><path d="M12 5l5 5-5 5M5 10h12" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          رجوع للقائمة
        </a>
      </div>
      <div class="lv-header-center">
        <span class="lv-header-icon">✔️</span>
        <h1 class="lv-header-title">تصحيح تقارير العمليات</h1>
      </div>
      <div class="lv-header-left"></div>
    </div>

    <div class="checker-body">
      <label class="lv-label" for="reportInput">الصق تقرير العمليات هنا بالكامل:</label>
      <textarea id="reportInput" class="lv-input lv-textarea" placeholder="الصق تقرير العمليات الرسمي هنا بالكامل..."></textarea>

      <div class="lv-actions" style="padding:0; margin-top:1.2rem; background:transparent; border:none;">
        <button class="lv-btn lv-btn-issue" id="checkBtn" onclick="checkReport()">
          <span>🔍</span><span>فحص التقرير</span>
        </button>
      </div>

      <div id="result" class="checker-result hidden"></div>
    </div>

  </div><!-- /lv-card -->

</main>

<footer class="footer" style="margin-top:auto;">
  <div class="footer-inner"><p class="footer-text">© 2026 بوابة شؤون الهلال الأحمر — جميع الحقوق محفوظة لقطاع الهلال الاحمر التابع لمقاطعة العاذرية</p></div>
</footer>

<script src="app.js"></script>
<script src="checker.js"></script>
</body>
</html>
